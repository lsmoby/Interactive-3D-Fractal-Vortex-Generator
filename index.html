<!DOCTYPE html>
<html>
<head>
    <title>User-Controlled Vortex</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #gui { position: absolute; top: 10px; left: 10px; }
    </style>
</head>
<body>
    <div id="gui"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.7/build/dat.gui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, gui, controls;
        let fractalObjects = [];
        const params = {
            startNumber: 5,
            depth: 6,
            branches: 6,
            spiralTightness: 0.5,
            radius: 15,
            lineWidth: 0.3,
            rotationSpeed: 0,
            generate: () => generateVortex()
        };

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            
            camera.position.z = 100;
            setupGUI();
            setupLights();
            setupControls();
        }

        function setupControls() {
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
        }

        function setupLights() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(100, 100, 100);
            scene.add(pointLight);
        }

        function setupGUI() {
            gui = new dat.GUI({ autoPlace: false });
            document.getElementById('gui').appendChild(gui.domElement);
            
            gui.add(params, 'startNumber', 0, 9, 1).name('Start Number');
            gui.add(params, 'depth', 1, 6, 1);
            gui.add(params, 'branches', 2, 28, 1);
            gui.add(params, 'spiralTightness', 0.1, 2).name('Spiral Tightness');
            gui.add(params, 'radius', 10, 50);
            gui.add(params, 'lineWidth', 0.1, 1).name('Line Width');
            gui.add(params, 'rotationSpeed', -0.02, 0.02).name('Rotation Speed');
            gui.add(params, 'generate').name('Generate Vortex');
        }

        async function generateVortex() {
            // Clear previous objects
            fractalObjects.forEach(obj => scene.remove(obj));
            fractalObjects = [];
            
            const loader = new THREE.FontLoader();
            const font = await loader.loadAsync(
                'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_regular.typeface.json'
            );

            const spiralPoints = [];
            generateBranch(
                new THREE.Vector3(0, 0, 0),
                params.startNumber,
                0,
                font,
                params.depth,
                spiralPoints,
                new THREE.Color().setHSL(0, 1, 0.5)
            );

            const spiralGeometry = new THREE.BufferGeometry().setFromPoints(spiralPoints);
            const spiralLine = new THREE.Line(
                spiralGeometry,
                new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: params.lineWidth })
            );
            scene.add(spiralLine);
            fractalObjects.push(spiralLine);
        }

        function generateBranch(position, number, angle, font, depth, spiralPoints, branchColor) {
            if (depth <= 0) return;

            const textGeometry = new THREE.TextGeometry(number.toString(), {
                font: font,
                size: 1.5,
                height: 0.3
            });
            const textMaterial = new THREE.MeshPhongMaterial({ color: branchColor.getHex() });
            const textMesh = new THREE.Mesh(textGeometry, textMaterial);

            const spiralAngle = angle * params.spiralTightness;
            const radius = params.radius * (params.depth - depth + 1);
            position.x = radius * Math.cos(spiralAngle);
            position.y = radius * Math.sin(spiralAngle);
            position.z = -depth * 8;

            textMesh.position.copy(position);
            textMesh.rotation.z = spiralAngle;
            
            scene.add(textMesh);
            fractalObjects.push(textMesh);

            if (depth === params.depth) spiralPoints.push(position.clone());

            const newHue = (branchColor.getHSL().h + 0.05) % 1;
            const newBranchColor = new THREE.Color().setHSL(newHue, 1, 0.5);

            for (let i = 0; i < params.branches; i++) {
                const newNumber = (number + i) % 10;
                const newAngle = angle + (Math.PI * 2 * i)/params.branches;
                
                const childPosition = new THREE.Vector3();
                const childRadius = params.radius * (params.depth - depth + 2);
                const childSpiralAngle = newAngle * params.spiralTightness;
                
                childPosition.x = childRadius * Math.cos(childSpiralAngle);
                childPosition.y = childRadius * Math.sin(childSpiralAngle);
                childPosition.z = -(depth - 1) * 8;

                const lineGeometry = new THREE.BufferGeometry().setFromPoints([position, childPosition]);
                const lineMaterial = new THREE.LineBasicMaterial({
                    color: newBranchColor.getHex(),
                    linewidth: params.lineWidth
                });
                const line = new THREE.Line(lineGeometry, lineMaterial);
                
                scene.add(line);
                fractalObjects.push(line);

                generateBranch(childPosition, newNumber, newAngle, font, depth-1, spiralPoints, newBranchColor);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if(Math.abs(params.rotationSpeed) > 0.001) scene.rotation.y += params.rotationSpeed;
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
